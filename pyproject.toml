[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcsfe"
authors = [{ name = "fieryhenry" }]
description = "A save file editor for The Battle Cats"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Utilities",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
dependencies = ["pyjwt", "requests", "pyyaml"]

dynamic = ["version"]
keywords = ["battle cats", "save editor", "hacking"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1.380"]

[project.urls]
Homepage = "https://github.com/meowzerskittycat/BCSFE"
Repository = "https://github.com/meowzerskittycat/BCSFE"
Issues = "https://github.com/meowzerskittycat/BCSFE/issues"
Changelog = "https://github.com/meowzerskittycat/BCSFE/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "bcsfe.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["bcsfe"]
branch = true

[tool.coverage.report]
# CI fails if coverage drops below this. Raise it as tests are added; don't
# lower it to get green.
fail_under = 60
skip_covered = true
sort = "cover"

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "S602", "S604", "S605"]
ignore = [
  "E402", # core/__init__.py and friends order imports to break import cycles
  "E731",
  "E741",
  "B008",
  "B023", # menu lambdas are invoked synchronously inside the loop iteration
]

[project.scripts]
bcsfe = "bcsfe:run"
