welcome=
><@t>Chào mừng đến với <@s>Battle Cats Save File Editor</>!
>Một bản fork của <@s>BCSFE-Python</> do <@s>fieryhenry</> tạo: <@s>https://codeberg.org/fieryhenry/BCSFE-Python</>
>
>GitHub: <@s>https://github.com/meowzerskittycat/BCSFE</>
>Báo cáo lỗi và đóng góp ý kiến: <@s>https://github.com/meowzerskittycat/BCSFE/issues</>
>
>Vị trí file cấu hình (Config): <@s>{config_path}</>
>
>{theme_text}
>
>{locale_text}
>
><@q>Lời cảm ơn gửi đến:
>- <@s>fieryhenry</> vì đã viết BCSFE-Python, nền tảng của editor này
>- <@s>Editor của Lethal</> vì đã tìm ra cách patch save data và chỉnh sửa cf/xp: <@s>https://www.reddit.com/r/BattleCatsCheats/comments/djehhn/editoren/</>
>- Code của <@s>Beeven</> và <@s>csehydrogen</>, đã chỉ ra cách patch save data: https://github.com/beeven/battlecats và https://github.com/csehydrogen/BattleCatsHacker
>- <@s>HungJoesifer</> và <@s>LinYuAn</> vì bản dịch tiếng Việt và tiếng Trung Phồn thể</>
>
><@w>Nếu bạn đã phải trả tiền cho phần mềm này, bạn đã bị lừa đảo. Phần mềm này hoàn toàn miễn phí và mã nguồn mở.</>
>
><@w>Hãy tự chịu rủi ro khi sử dụng công cụ này. Không ai chịu trách nhiệm cho bất kỳ lệnh ban nào hoặc thiệt hại nào gây ra cho file save của bạn.
>Save editor luôn cố gắng ngăn chặn điều này xảy ra, nhưng không thể đảm bảo rằng file save của bạn an toàn 100%.
>Nếu file save của bạn thực sự bị hỏng, vui lòng báo cáo tại <@s>https://github.com/meowzerskittycat/BCSFE/issues</>
>Hãy tạo các bản sao lưu (backups) cho file save của mình trước khi chỉnh sửa nó.</>
>
>*Lưu ý từ Người dịch: <@s>Bạn có thể gửi lỗi dịch về locale bản Việt tại <@su>https://github.com/meowzerskittycat/BCSFE/issues</> nếu muốn góp ý (hoặc muốn tự sửa cũng được). AHOY!!🏴‍☠️</>

