input_many=輸入 <@q>{min}</> 到<@q>{max}</> 之間的數字並以空格分隔：
input=輸入 <@t>{name}</>的數值 (目前值： <@q>{value}</>) (最大值： <@q>{max}</>)：
value_changed=<@su>成功將 <@s>{name}</> 變更為 <@s>{value}</>
value_gave=<@su>成功發送 <@s>{name}</>
all_at_once=一次全選
invalid_input=<@e>輸入無效。請重試。</>
invalid_input_int=<@e>輸入無效。請輸入一個介於 <@s>{min}</> 到 <@s>{max}</>的數值</>
select_option=選擇選項：
finish=完成
features=功能：
go_back=返回
yes_key=y
no_key=n
quit_key=q
range_input=以空格分隔 (例如<@t>1 2 3 192</>), 或輸入範圍 (例如 <@t>1-43</>) 或輸入 <@t>all</>：
select_features=輸入<@q>數字</>、輸入<@t>文字</>來搜尋，或留空以列出所有功能：
>若要選擇功能，輸入
>- 左側對應的 <@q>number</> 數字
>- <@t>text</> 來搜尋功能
>你可以按 <@t>enter</> 來檢視所有功能
>部分功能為 <@t>分類</>，選取後會顯示該分類下的所有 <@t>子功能</>
>輸入：

individual=個別設定
edit_all_at_once=統一設定
value={name} : <@q>{value}</>
input_generic=輸入 <@t>{name}</> 的數值 (最大值： <@q>{max}</>)：
value_unchanged=<@t>{name}</> 未變更 (<@s>{value}</>)
individual_or_all_at_once=你要<@t>個別</>編輯還是<@t>統一設定</> <@t>{group}</>？：
invalid_yes_no=<@e>請回答 <@s>y</> 或 <@s>n</> (留空則取消)</>
choose_one=<@e>請只選擇一個選項</>
input_no_max=輸入 <@t>{name}</> 的數值 (目前值： <@t>{value}</>，留空則保持不變)：
invalid_range=<@e>無效的範圍格式，應為 \<num\>-\<num\> 或 \<num\>，而不是 {val}</>
select_feature_number=輸入<@q>數字</> (<@t>0</> 或留空則返回)：
all_features=所有功能：
feature_search_results=符合 <@s>{query}</> 的功能：
individually=個別設定
