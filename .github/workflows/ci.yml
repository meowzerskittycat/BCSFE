name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request replaces its older run, so runs don't pile up
# waiting for runners (macOS runners are scarce). Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pyright

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are scarce and a job left waiting is cancelled, which
        # marked main red without a test failing, so macOS runs on pull
        # requests and manual runs only.
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Game data for the menu tests, from the bcdata mirror. Change the key
      # when tests/tools/get_game_data.py asks for another version.
      - uses: actions/cache@v5
        with:
          path: tests/game_data
          key: game-data-en-15.6.1
      - run: python tests/tools/get_game_data.py
      # Pull requests also run every menu feature with each set of answers.
      # Linux also measures coverage, which fails the job if it drops below
      # fail_under in pyproject.toml, and puts the report in the run summary.
      - run: pytest ${{ github.event_name == 'pull_request' && '--all-answers' || '' }} ${{ runner.os == 'Linux' && '--cov --cov-report=' || '' }}
      - if: runner.os == 'Linux' && !cancelled()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
